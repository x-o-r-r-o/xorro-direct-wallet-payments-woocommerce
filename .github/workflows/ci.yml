name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          find . -path ./releases -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Smoke tests
        run: php tests/smoke-test.php

      - name: Payment-matching tests (recorded explorer responses)
        run: php tests/matching-tests.php

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse every script
        run: |
          for file in assets/js/*.js; do
            node --check "$file"
          done

  standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    # Advisory: the sniffs disagree with some deliberate choices here (raw SQL for
    # atomic locks, for one), so a failure reports rather than blocks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: cs2pr, phpcs

      - name: Install the WordPress rules
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress wp-coding-standards/wpcs:^3.1
          echo "$HOME/.composer/vendor/bin" >> "$GITHUB_PATH"

      - name: Run phpcs
        run: phpcs -q --report=checkstyle | cs2pr
