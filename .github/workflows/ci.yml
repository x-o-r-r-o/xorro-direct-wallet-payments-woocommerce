name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the declared minimum; 8.5 is the newest release. Everything in between
        # that a shop is likely to be on is covered, so a fix for one cannot break another.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          find . -path ./releases -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Smoke tests
        run: php tests/smoke-test.php

      - name: Payment-matching tests (recorded explorer responses)
        run: php tests/matching-tests.php

      - name: Address derivation tests (published BIP32/44/49/84 vectors)
        run: php tests/hd-tests.php

      - name: Order-query tests (both WooCommerce order data stores)
        run: php tests/order-query-tests.php

      - name: Backup tests (what each export carries, and what a restore leaves alone)
        run: php tests/backup-tests.php

      - name: Verdict tests (what a customer is told after paying)
        run: php tests/verdict-tests.php

      - name: Reconcile tests (listing transfers, and never calling an unread chain clean)
        run: php tests/reconcile-tests.php

      - name: Test-mode tests (rehearsing on a test network, and never mixing it with the real one)
        run: php tests/testmode-tests.php

      - name: Rehearsal tests (only a rehearsal order can ever be confirmed without payment)
        run: php tests/rehearsal-tests.php

      # Every suite again with deprecations fatal. A deprecation is not cosmetic here: on a
      # shop with display_errors on it is printed into whatever the page was sending, which
      # for a CSV download or a JSON response means a corrupt file rather than a warning.
      - name: No PHP deprecations or warnings on this version
        run: |
          status=0
          for suite in smoke-test matching-tests hd-tests order-query-tests backup-tests verdict-tests reconcile-tests testmode-tests rehearsal-tests; do
            out=$(php -d error_reporting=E_ALL -d display_errors=stderr \
              "tests/${suite}.php" 2>&1 >/dev/null)
            if [ -n "$out" ]; then
              echo "::error::${suite} raised PHP diagnostics on PHP ${{ matrix.php }}"
              echo "$out"
              status=1
            fi
          done
          exit $status

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse every script
        run: |
          for file in assets/js/*.js; do
            node --check "$file"
          done

  standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: cs2pr, phpcs

      - name: Install the WordPress rules
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress wp-coding-standards/wpcs:^3.1
          echo "$HOME/.composer/vendor/bin" >> "$GITHUB_PATH"

      - name: Run phpcs
        # Errors fail the build. Warnings are still reported inline, but several are
        # deliberate here — base64 memos from Cosmos and Hedera, a one-minute cron, direct
        # file calls in the test scripts — so they do not stop a release.
        run: phpcs -q --report=checkstyle --runtime-set ignore_warnings_on_exit 1 | cs2pr --graceful-warnings
