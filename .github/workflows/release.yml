name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.4.1). Leave empty to use the pushed tag.'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          PLUGIN_VERSION="$(grep -E "define\( 'XDWP_VERSION'" xorro-direct-wallet-payments-woocommerce.php | sed -E "s/.*'([0-9.]+)'.*/\1/")"
          echo "plugin_version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${VERSION}" != "${PLUGIN_VERSION}" ]; then
            echo "Tag version ${VERSION} does not match plugin ${PLUGIN_VERSION}" >&2
            exit 1
          fi

      - name: Build WordPress ZIP
        run: |
          chmod +x bin/build-zip.sh
          bin/build-zip.sh "${RUNNER_TEMP}"
          cp "${RUNNER_TEMP}/xorro-direct-wallet-payments-woocommerce.zip" "xorro-direct-wallet-payments-woocommerce-${{ steps.meta.outputs.version }}.zip"
          cp "${RUNNER_TEMP}/xorro-direct-wallet-payments-woocommerce-${{ steps.meta.outputs.version }}.zip.sha256" .

      - name: Sign release (Ed25519)
        env:
          XDWP_SIGNING_KEY: ${{ secrets.XDWP_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          ZIP="xorro-direct-wallet-payments-woocommerce-${VERSION}.zip"
          if [ -z "${XDWP_SIGNING_KEY}" ]; then
            echo "XDWP_SIGNING_KEY secret is not set; refusing to publish an unsigned release (sites would not install it)." >&2
            exit 1
          fi
          WORK="$(mktemp -d)"
          trap 'rm -rf "${WORK}"' EXIT
          umask 077
          printf '%s\n' "${XDWP_SIGNING_KEY}" > "${WORK}/key.pem"
          # Must match Xdwp_Updater::signed_manifest() byte for byte.
          SHA="$(sha256sum "${ZIP}" | cut -d' ' -f1)"
          printf 'xdwp-release:1\nplugin:xorro-direct-wallet-payments-woocommerce\nversion:%s\nsha256:%s\n' "${VERSION}" "${SHA}" > "${WORK}/manifest.txt"
          openssl pkeyutl -sign -inkey "${WORK}/key.pem" -rawin -in "${WORK}/manifest.txt" -out "${WORK}/sig.bin"
          base64 -w0 "${WORK}/sig.bin" > "${ZIP}.sig"
          # Self-check against the public key(s) shipped in the plugin, so a wrong or rotated
          # secret fails here instead of producing a release no site will accept.
          VERIFIED=0
          for KEY in $(grep -oE "'[A-Za-z0-9+/]{43}='" includes/class-xdwp-updater.php | tr -d "'"); do
            { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; printf '%s' "${KEY}" | base64 -d; } > "${WORK}/pub.der"
            if openssl pkeyutl -verify -pubin -keyform DER -inkey "${WORK}/pub.der" -rawin -in "${WORK}/manifest.txt" -sigfile "${WORK}/sig.bin" >/dev/null 2>&1; then
              VERIFIED=1
            fi
          done
          if [ "${VERIFIED}" != 1 ]; then
            echo "Signature does not verify against RELEASE_PUBLIC_KEYS in includes/class-xdwp-updater.php" >&2
            exit 1
          fi
          echo "Signed ${ZIP} (sha256 ${SHA})"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: xorro-direct-wallet-payments-woocommerce-${{ steps.meta.outputs.version }}.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: Xorro Direct Wallet Payments for WooCommerce
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES="$(awk "/^= ${VERSION} =/{flag=1; next} /^= /{flag=0} flag" readme.txt | sed '/^$/d' | sed 's/^\* /- /')"
          if [ -z "${NOTES}" ]; then
            NOTES="${NAME} ${VERSION} WordPress plugin package."
          fi
          BODY=$(printf '%s\n\n%s\n\n%s\n%s\n' \
            "## ${NAME} ${VERSION}" \
            "${NOTES}" \
            "Install via **Plugins → Add New → Upload** using \`xorro-direct-wallet-payments-woocommerce-${VERSION}.zip\`." \
            "The ZIP is signed with the maintainer's Ed25519 release key (\`.sig\`); the plugin's updater refuses unsigned or altered packages.")
          gh release create "${TAG}" \
            --title "${NAME} ${VERSION}" \
            --notes "${BODY}" \
            --target "${{ github.sha }}" \
            "xorro-direct-wallet-payments-woocommerce-${VERSION}.zip#xorro-direct-wallet-payments-woocommerce-${VERSION}.zip (WordPress install package)" \
            "xorro-direct-wallet-payments-woocommerce-${VERSION}.zip.sha256#SHA-256 checksum" \
            "xorro-direct-wallet-payments-woocommerce-${VERSION}.zip.sig#Ed25519 release signature"
